services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kam_app
      POSTGRES_PASSWORD: kam_app_password
      POSTGRES_DB: kam_intelligence
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kam_app -d kam_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kam_app:kam_app_password@db:5432/kam_intelligence
      JWT_SECRET_KEY: replace-this-docker-development-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      RESET_TOKEN_EXPIRE_MINUTES: 30
      SUPER_ADMIN_EMAIL: admin@tkxel.com
      SUPER_ADMIN_PASSWORD: Admin@12345
      SUPER_ADMIN_FULL_NAME: KAM Super Admin
      SUPER_ADMIN_TITLE: Platform Owner
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User@12345}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-tkxel.com,tkxel.io,camp1.tkxel.com,camp1.tkxel.io}
      GOOGLE_SIGN_IN_CLIENT_ID: ${GOOGLE_SIGN_IN_CLIENT_ID:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
      EXPOSE_RESET_TOKENS: "true"
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@tkxel.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-KAM Intelligence Platform}
      MAIL_SEND_DURING_TESTS: ${MAIL_SEND_DURING_TESTS:-false}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://127.0.0.1:5173}
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8001"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8001}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  frontend_node_modules:
