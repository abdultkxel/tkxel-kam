services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kam_app
      POSTGRES_PASSWORD: kam_app_password
      POSTGRES_DB: kam_intelligence
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kam_app -d kam_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kam_app:kam_app_password@db:5432/kam_intelligence
      JWT_SECRET_KEY: replace-this-docker-development-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      RESET_TOKEN_EXPIRE_MINUTES: 30
      APP_ACCESS_MODE: ${APP_ACCESS_MODE:-LOCAL}
      LAN_HOST_IP: ${LAN_HOST_IP:-}
      BACKEND_HOST_PORT: ${BACKEND_HOST_PORT:-8001}
      FRONTEND_HOST_PORT: ${FRONTEND_HOST_PORT:-5173}
      SUPER_ADMIN_EMAIL: admin@tkxel.com
      SUPER_ADMIN_PASSWORD: Admin@12345
      SUPER_ADMIN_FULL_NAME: KAM Super Admin
      SUPER_ADMIN_TITLE: Platform Owner
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User@12345}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-tkxel.com,tkxel.io,camp1.tkxel.com,camp1.tkxel.io}
      INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ${INTEGRATION_CREDENTIAL_ENCRYPTION_KEY:-replace-this-local-integration-encryption-key}
      GOOGLE_SIGN_IN_CLIENT_ID: ${GOOGLE_SIGN_IN_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://127.0.0.1:8001/api/admin/integrations/google-calendar/oauth-callback}
      GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID: ${GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID:-primary}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
      EXPOSE_RESET_TOKENS: "true"
      CONTENT_STORAGE_BACKEND: ${CONTENT_STORAGE_BACKEND:-local}
      LOCAL_CONTENT_STORAGE_DIR: ${LOCAL_CONTENT_STORAGE_DIR:-/app/storage/content}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@tkxel.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-KAM Intelligence Platform}
      MAIL_SEND_DURING_TESTS: ${MAIL_SEND_DURING_TESTS:-false}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://127.0.0.1:5173}
      FATHOM_API_KEY: ${FATHOM_API_KEY:-}
      FATHOM_BASE_URL: ${FATHOM_BASE_URL:-https://api.fathom.ai}
      FATHOM_RECORDINGS_PATH: ${FATHOM_RECORDINGS_PATH:-/external/v1/meetings/}
      FATHOM_WEBHOOK_SECRET: ${FATHOM_WEBHOOK_SECRET:-}
      TIMELINE_RETENTION_WORKER_ENABLED: ${TIMELINE_RETENTION_WORKER_ENABLED:-true}
      TIMELINE_RETENTION_WORKER_INITIAL_DELAY_SECONDS: ${TIMELINE_RETENTION_WORKER_INITIAL_DELAY_SECONDS:-60}
      TIMELINE_RETENTION_WORKER_INTERVAL_SECONDS: ${TIMELINE_RETENTION_WORKER_INTERVAL_SECONDS:-86400}
      NOTIFICATIONS_REPORTING_WORKER_ENABLED: ${NOTIFICATIONS_REPORTING_WORKER_ENABLED:-true}
      NOTIFICATIONS_REPORTING_WORKER_INITIAL_DELAY_SECONDS: ${NOTIFICATIONS_REPORTING_WORKER_INITIAL_DELAY_SECONDS:-30}
      NOTIFICATIONS_REPORTING_WORKER_INTERVAL_SECONDS: ${NOTIFICATIONS_REPORTING_WORKER_INTERVAL_SECONDS:-300}
      INTEGRATIONS_WORKER_ENABLED: ${INTEGRATIONS_WORKER_ENABLED:-true}
      INTEGRATIONS_WORKER_INITIAL_DELAY_SECONDS: ${INTEGRATIONS_WORKER_INITIAL_DELAY_SECONDS:-45}
      INTEGRATIONS_WORKER_INTERVAL_SECONDS: ${INTEGRATIONS_WORKER_INTERVAL_SECONDS:-300}
      AI_KYC_PROVIDER: ${AI_KYC_PROVIDER:-local_openai_compatible}
      AI_KYC_API_KEY: ${AI_KYC_API_KEY:-local-demo}
      AI_KYC_BASE_URL: ${AI_KYC_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_KYC_MODEL: ${AI_KYC_MODEL:-qwen3:8b}
      AI_KYC_ORGANIZATION: ${AI_KYC_ORGANIZATION:-}
      AI_KYC_PROJECT: ${AI_KYC_PROJECT:-}
      AI_KYC_TIMEOUT_SECONDS: ${AI_KYC_TIMEOUT_SECONDS:-120}
      AI_KYC_MAX_RETRIES: ${AI_KYC_MAX_RETRIES:-1}
      AI_KYC_RETRY_BACKOFF_SECONDS: ${AI_KYC_RETRY_BACKOFF_SECONDS:-1.5}
      AI_KYC_MAX_INPUT_TOKENS: ${AI_KYC_MAX_INPUT_TOKENS:-18000}
      AI_KYC_MAX_OUTPUT_TOKENS: ${AI_KYC_MAX_OUTPUT_TOKENS:-6000}
      AI_KYC_TEMPERATURE: ${AI_KYC_TEMPERATURE:-0.1}
      AI_KYC_MAX_COST_PER_RUN_USD: ${AI_KYC_MAX_COST_PER_RUN_USD:-0}
      AI_KYC_DAILY_BUDGET_USD: ${AI_KYC_DAILY_BUDGET_USD:-0}
      AI_KYC_MONTHLY_BUDGET_USD: ${AI_KYC_MONTHLY_BUDGET_USD:-0}
      AI_KYC_ESTIMATED_INPUT_COST_PER_1K_USD: ${AI_KYC_ESTIMATED_INPUT_COST_PER_1K_USD:-0}
      AI_KYC_ESTIMATED_OUTPUT_COST_PER_1K_USD: ${AI_KYC_ESTIMATED_OUTPUT_COST_PER_1K_USD:-0}
      AI_KYC_RETRIEVAL_TOP_K: ${AI_KYC_RETRIEVAL_TOP_K:-30}
      AI_KYC_CHUNK_SIZE_TOKENS: ${AI_KYC_CHUNK_SIZE_TOKENS:-650}
      AI_KYC_CHUNK_OVERLAP_TOKENS: ${AI_KYC_CHUNK_OVERLAP_TOKENS:-90}
      AI_KYC_USE_EMBEDDINGS: ${AI_KYC_USE_EMBEDDINGS:-true}
      AI_KYC_EMBEDDING_PROVIDER: ${AI_KYC_EMBEDDING_PROVIDER:-local_hash}
      AI_KYC_EMBEDDING_MODEL: ${AI_KYC_EMBEDDING_MODEL:-local_hash}
      AI_KYC_EMBEDDING_DIMENSIONS: ${AI_KYC_EMBEDDING_DIMENSIONS:-384}
      KYC_DOCUMENT_EXTRACTION_ENABLED: ${KYC_DOCUMENT_EXTRACTION_ENABLED:-true}
      KYC_DOCUMENT_EXTRACTION_MAX_FILE_MB: ${KYC_DOCUMENT_EXTRACTION_MAX_FILE_MB:-25}
      KYC_OCR_ENABLED: ${KYC_OCR_ENABLED:-true}
      KYC_OCR_ENGINE: ${KYC_OCR_ENGINE:-tesseract}
      KYC_OCR_MIN_TEXT_CHARS: ${KYC_OCR_MIN_TEXT_CHARS:-80}
      KYC_QUEUE_BACKEND: ${KYC_QUEUE_BACKEND:-local}
      KYC_WORKER_ENABLED: ${KYC_WORKER_ENABLED:-true}
      KYC_WORKER_INITIAL_DELAY_SECONDS: ${KYC_WORKER_INITIAL_DELAY_SECONDS:-5}
      KYC_WORKER_INTERVAL_SECONDS: ${KYC_WORKER_INTERVAL_SECONDS:-5}
      KYC_WORKER_BATCH_SIZE: ${KYC_WORKER_BATCH_SIZE:-1}
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c '
        if [ "$$APP_ACCESS_MODE" = "QA" ] || [ "$$APP_ACCESS_MODE" = "qa" ]; then
          if [ -z "$$LAN_HOST_IP" ]; then
            echo "LAN_HOST_IP is required when APP_ACCESS_MODE=QA";
            exit 1;
          fi;
          export FRONTEND_APP_URL="http://$$LAN_HOST_IP:$${FRONTEND_HOST_PORT:-5173}";
          export BACKEND_CORS_ORIGINS="http://$$LAN_HOST_IP:$${FRONTEND_HOST_PORT:-5173},http://127.0.0.1:$${FRONTEND_HOST_PORT:-5173},http://localhost:$${FRONTEND_HOST_PORT:-5173},http://127.0.0.1:5174,http://localhost:5174";
        fi;
        uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
      '

  frontend:
    build:
      context: ./frontend
    environment:
      APP_ACCESS_MODE: ${APP_ACCESS_MODE:-LOCAL}
      LAN_HOST_IP: ${LAN_HOST_IP:-}
      BACKEND_HOST_PORT: ${BACKEND_HOST_PORT:-8001}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8001}
      VITE_GOOGLE_SIGN_IN_CLIENT_ID: ${VITE_GOOGLE_SIGN_IN_CLIENT_ID:-}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: >
      sh -c '
        if [ "$$APP_ACCESS_MODE" = "QA" ] || [ "$$APP_ACCESS_MODE" = "qa" ]; then
          if [ -z "$$LAN_HOST_IP" ]; then
            echo "LAN_HOST_IP is required when APP_ACCESS_MODE=QA";
            exit 1;
          fi;
          export VITE_API_BASE_URL="http://$$LAN_HOST_IP:$${BACKEND_HOST_PORT:-8001}";
        fi;
        npm run dev -- --host 0.0.0.0 --port 5173
      '

volumes:
  postgres_data:
  frontend_node_modules:
