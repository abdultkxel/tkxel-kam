sonar.projectKey=tkxel-kam
sonar.projectName=Tkxel KAM Intelligence Platform
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  backend/storage/**,\
  backend/kam_intelligence.db,\
  backend/migrations/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx,\
  frontend/src/test/**

sonar.test.inclusions=\
  backend/tests/**/*.py,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx

sonar.coverage.exclusions=\
  backend/tests/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx,\
  frontend/src/test/**,\
  frontend/src/vite-env.d.ts

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json
