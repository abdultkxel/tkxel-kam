 internal functions. It does not replace delivery, sales, finance, or leadership. It connects them around account outcomes and gives each team the context needed to act."},{title:"1.4 What Problems KAM Solves for Tkxel",body:"KAM reduces fragmented account ownership, late escalation discovery, unclear stakeholder coverage, weak renewal preparation, and missed expansion timing."}]},{id:"operating-model",number:"2",title:"KAM Operating Model Overview",summary:"Explains the working model AMs use to convert account intelligence into repeatable execution.",icon:qx,topics:[{title:"2.1 Components of Tkxel's KAM Operating Model",body:"The model combines KYC, account strategy, governance cadence, health scoring, escalation handling, opportunity planning, and leadership review.",bullets:["KYC workspace as the source of truth","Governance calendar as the execution rhythm","Health score and escalations as risk signals"]},{title:"2.2 Outcome of the Operating Model",body:"The expected outcome is a managed portfolio where leadership can see account quality, AMs can prioritize work, delivery can act on context, and clients experience a more coordinated Tkxel partnership."}]},{id:"objective",number:"3",title:"Objective of This Playbook",summary:"Sets the purpose and boundaries of the KAM playbook for AMs, leadership, and partner teams.",icon:z0,topics:[{title:"3.1 Purpose of the Playbook",body:"This playbook gives Tkxel AMs a shared way to identify key accounts, document account intelligence, run governance, assess health, and manage growth or retention plays."},{title:"3.2 What This Playbook Covers",body:"It covers the AM role, KAM operating model, competencies, lifecycle processes, KYC, strategy planning, health improvement techniques, and common governance plays."}]},{id:"jd-competencies",number:"4",title:"Job Description (JD) + Competencies of Tkxel Account Managers",summary:"Defines the AM profile and role expectations for assigned Tkxel accounts.",icon:GD,topics:[{title:"4.1 Job Description: Account Manager (Tkxel)",body:"The Account Manager is responsible for relationship management, retention health, governance rhythm, account planning, commercial coordination, and cross-functional execution for assigned accounts.",bullets:["Maintain account plans and KYC artifacts","Drive QBRs and executive alignment","Coordinate renewal and expansion readiness"]}]},{id:"processes",number:"5",title:"Processes (High-Level Definition)",summary:"Documents the end-to-end KAM lifecycle and the interlocks required for execution.",icon:Dt,topics:[{title:"5.1 The End-to-End KAM Lifecycle",body:"The lifecycle starts with portfolio prioritization, moves into KYC and account planning, then continues through governance, health tracking, opportunity development, escalation response, and renewal or expansion review."},{title:"5.2 Roles & Responsibilities Across the Process",body:"AMs own account orchestration. Delivery owns execution status. Sales supports commercial strategy. Finance supports ARR and pricing decisions. Leadership supports prioritization, escalation, and executive sponsorship."}]},{id:"kyc",number:"6",title:"KYC (Know Your Customer)",summary:"Captures the customer context AMs need before planning account strategy.",icon:Sr,topics:[{title:"6.1 Purpose of KYC",body:"KYC creates a structured view of the client, market, stakeholders, engagement history, financial context, and current account risks."},{title:"6.2 Information Sources & Data Gathering",body:"AMs gather information from CRM notes, delivery updates, governance meetings, client websites, public filings, stakeholder conversations, finance records, and prior proposals."},{title:"6.3 Data-Gathering Methodology (Optional but Recommended)",body:"Use a three-pass method: collect known internal facts, validate through client-facing conversations, then synthesize KYC findings with confidence notes."},{title:"6.4 Detailed Section Breakdown",body:"KYC should summarize market context, client business context, stakeholders, Tkxel engagement, and financial landscape. Each section should distinguish facts from assumptions."},{title:"A. Market Research",body:"Dummy data includes industry trends, competitor pressure, regulatory factors, technology investment signals, and market events that could affect the account."},{title:"B. Client Research",body:"Dummy data includes company priorities, business units served by Tkxel, known transformation programs, digital maturity, and budget climate."},{title:"C. Stakeholder Details",body:"Dummy data includes executive sponsor, procurement owner, delivery counterpart, technical champion, renewal influencer, and relationship strength rating."},{title:"D. Tkxel Engagement with Client",body:"Dummy data includes current services, delivery teams, active projects, governance cadence, open commitments, and historical wins or friction points."},{title:"E. Financial Landscape",body:"Dummy data includes ARR, renewal date, contract model, open invoices, pricing sensitivity, expansion appetite, and commercial risks."},{title:"6.5 Requirements for Completing KYC",body:"KYC is complete when required fields are populated, assumptions are flagged, stakeholder coverage is documented, and the AM can explain the account context in a leadership review."},{title:"6.6 Deliverable: Completed KYC",body:"The deliverable is reviewed KYC data with source notes, confidence ratings, open questions, and next actions for missing intelligence."}]},{id:"strategy",number:"7",title:"Account Strategy & Planning",summary:"Turns KYC information into account strategy, health actions, and expansion or retention plans.",icon:qx,topics:[{title:"7.1 Purpose of Account Strategy & Planning",body:"Planning converts client understanding into a prioritized action path. It defines account objectives, growth or retention plays, stakeholder strategy, governance cadence, and measurable outcomes."},{title:"7.2 Approach: How Planning Happens After KYC",body:"After KYC, the AM reviews signals with delivery, sales, finance, and leadership. The team agrees on account posture, strategic plays, risk actions, and next governance commitments."},{title:"7.3 Tkxel-Specific Planning Method (4-Step Internal Framework)",body:"Tkxel planning uses four internal steps: align on client goals, segment the account, map services, and assess health. Each step produces one or more account actions."},{title:"Step 1: Vision/Mission & Goals Alignment",body:"Capture what the client is trying to achieve, how success is measured, and where Tkxel work contributes to that business outcome."},{title:"Step 2: Segmentation Strategy",body:"Classify the account as growth, retention, recovery, adoption, or executive priority. The segment determines cadence, leadership involvement, and play selection."},{title:"Step 3: Service Mapping & Applicability Assessment",body:"Map Tkxel services against client needs, current usage, adjacent demand, budget fit, and stakeholder readiness. Flag services as active, relevant, future, or not applicable."},{title:"Step 4: Client Health Assessment",body:"Assess relationship, delivery, usage, commercial, and strategic health. Scores should be evidence-based and linked to account actions."},{title:"7.4 Practical Actions & Techniques for Improving Client Health Score",body:"Improvement actions include executive sponsor mapping, cadence correction, delivery recovery plans, value realization workshops, renewal readiness, and stakeholder education."}]},{id:"common-play",number:"8",title:"Governance Activities / Account play",summary:"Provides repeatable plays AMs can use across the portfolio for governance and execution visibility.",icon:nd,topics:[{title:"8.1 Monthly SteerCos (Steering Committee Meetings)",body:"Monthly SteerCos align senior stakeholders on progress, risks, decisions, and upcoming priorities. Each SteerCo should produce actions, owners, and decision notes."},{title:"8.2 Delivery Progress Reviews (Weekly or Bi-Weekly)",body:"Progress
